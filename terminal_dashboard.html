<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORNING//STRATEGIST — TERMINAL</title>
<style>
  :root{
    --bg:#050807; --panel:#0a120d; --line:#0f3d24;
    --grn:#33ff88; --grn-dim:#1f8f52;
    --amber:#ffcc44; --up:#33ff88; --dn:#ff4d5e; --flat:#6b7a70;
    --txt:#8affc0; --mut:#3f7a58;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:13px;line-height:1.5}
  body{
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,20,10,0.25) 3px, rgba(0,0,0,0) 4px),
      radial-gradient(ellipse at 50% 0%, rgba(20,80,45,0.10), transparent 70%);
    min-height:100vh; padding:14px; letter-spacing:.02em;
  }
  .scan{pointer-events:none;position:fixed;inset:0;background:linear-gradient(rgba(10,25,15,0)0%,rgba(10,25,15,0)40%,rgba(30,120,70,0.05)50%,rgba(10,25,15,0)60%);background-size:100% 8px;animation:scan 8s linear infinite;z-index:9}
  @keyframes scan{0%{background-position:0 -100vh}100%{background-position:0 100vh}}

  #boot{position:fixed;inset:0;background:var(--bg);z-index:50;padding:24px;font-size:13px;color:var(--grn-dim);overflow:hidden}
  #boot .ln{white-space:pre}
  #boot .ok{color:var(--grn)}
  #boot .warn{color:var(--amber)}
  #boot.done{animation:fade .6s forwards}
  @keyframes fade{to{opacity:0;visibility:hidden}}

  .wrap{max-width:1100px;margin:0 auto;position:relative;z-index:1;opacity:0}
  .wrap.in{animation:rise .7s ease forwards}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .top{border:1px solid var(--line);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:var(--panel)}
  .brand{color:var(--grn);font-weight:bold;text-shadow:0 0 8px rgba(51,255,136,.5)}
  .brand .blink{animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .meta{color:var(--mut);font-size:11px}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--grn);font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .mood{padding:2px 10px;border:1px solid;border-radius:2px;font-weight:bold}
  .mood.dn{color:var(--dn);border-color:var(--dn);text-shadow:0 0 8px rgba(255,77,94,.5)}
  .mood.up{color:var(--up);border-color:var(--up);text-shadow:0 0 8px rgba(51,255,136,.5)}

  .ticker{overflow:hidden;white-space:nowrap;border:1px solid var(--line);border-top:none;background:#060d09;padding:5px 0}
  .ticker .run{display:inline-block;animation:tick 40s linear infinite;padding-left:100%}
  @keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  .tk{margin:0 18px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);background:var(--panel)}
  .panel h2{margin:0;font-size:11px;letter-spacing:.15em;color:var(--grn);background:#08160e;border-bottom:1px solid var(--line);padding:6px 10px;text-transform:uppercase}
  .panel .body{padding:8px 10px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{padding:3px 6px;text-align:right;white-space:nowrap}
  td.l,th.l{text-align:left;color:var(--txt)}
  th{color:var(--mut);font-weight:normal;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.08em}
  tr:hover td{background:rgba(30,120,70,.08)}
  .up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--flat)}
  .num{color:#c9ffe2}
  .flash{animation:fl .8s ease}
  @keyframes fl{0%{background:rgba(51,255,136,.35)}100%{background:transparent}}
  .big{grid-column:1/-1}

  .hold{border:1px solid var(--line);background:#071009;padding:8px 10px;margin-bottom:6px}
  .hold .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .hold .nm{color:#c9ffe2;font-weight:bold}
  .hold .code{color:var(--mut);font-size:10px}
  .hold .px{font-size:16px;font-weight:bold}
  .hold .r2{display:flex;justify-content:space-between;align-items:center;margin-top:4px;color:var(--mut);font-size:10.5px}
  .hold svg{display:block;margin-top:4px}
  .flag{color:var(--amber);font-size:10px}

  .heat{display:flex;flex-wrap:wrap;gap:4px}
  .cell{flex:1 1 90px;border:1px solid var(--line);padding:6px 7px;background:#071009;min-width:88px}
  .cell .cnm{color:var(--mut);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .pc{font-weight:bold;font-size:14px}
  .cell .cl{color:#9fdfbf;font-size:11px}

  .news{margin:0;padding:0}
  .news li{list-style:none;border-bottom:1px dashed var(--line);padding:5px 0;font-size:12px}
  .news .tm{color:var(--mut);font-size:10px;margin-right:6px}
  .news .td{color:var(--amber)}
  .news b{color:#c9ffe2}
  .foot{color:var(--mut);font-size:10px;text-align:center;margin:14px 0 4px;border-top:1px solid var(--line);padding-top:8px}
</style>
</head>
<body>
<div class="scan"></div>
<div id="boot"></div>

<div class="wrap" id="wrap">
  <div class="top">
    <span class="brand">◆ MORNING//STRATEGIST<span class="blink">▊</span></span>
    <span class="meta" id="stamp"></span>
    <span class="live"><span class="dot"></span>LIVE</span>
    <span class="mood dn" id="mood">—</span>
  </div>

  <div class="ticker"><span class="run" id="ticker"></span></div>

  <div class="grid">
    <div class="panel">
      <h2>// 米国市場・マクロ</h2>
      <div class="body"><table id="macro"><thead>
        <tr><th class="l">指標</th><th>終値</th><th>前日比</th></tr>
      </thead><tbody></tbody></table></div>
    </div>

    <div class="panel">
      <h2>// 保有銘柄</h2>
      <div class="body" id="holds"></div>
    </div>

    <div class="panel big">
      <h2>// 半導体セクター [heatmap]</h2>
      <div class="body"><div class="heat" id="semi"></div></div>
    </div>

    <div class="panel big">
      <h2>// ニュース feed</h2>
      <div class="body"><ul class="news" id="feed"></ul></div>
    </div>
  </div>

  <div class="foot">DATA: yfinance / J-Quants / RSS &nbsp;·&nbsp; 全数値はPython計算結果・投資助言ではない</div>
</div>

<script>
function fmt(n){return Number(n).toLocaleString("ja-JP",{maximumFractionDigits:2})}
function cls(v){return v>0?"up":v<0?"dn":"flat"}
function arw(v){return v>0?"▲":v<0?"▼":"■"}
function pc(v){return arw(v)+Math.abs(v).toFixed(2)+"%"}

function countUp(el, target, decimals){
  const dur=700, t0=performance.now();
  (function step(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3), v=target*e;
    el.textContent=v.toLocaleString("ja-JP",{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
    if(p<1)requestAnimationFrame(step);
  })(performance.now());
}

function spark(series, up){
  if(!series||series.length<2) return "";
  const w=140,h=28,pad=2;
  const mn=Math.min(...series), mx=Math.max(...series), rng=(mx-mn)||1;
  const pts=series.map((v,i)=>{
    const x=pad+(w-2*pad)*i/(series.length-1);
    const y=pad+(h-2*pad)*(1-(v-mn)/rng);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  const col=up?"#33ff88":"#ff4d5e";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${col}" stroke-width="1.3" points="${pts}"/></svg>`;
}

function moodOf(macro){
  let sox=0,n225=0;
  macro.forEach(m=>{ if(/SOX/.test(m.k))sox=m.c; if(/日経|225/.test(m.k))n225=m.c; });
  return (sox+n225)/2 < 0 ? "dn" : "up";
}

function paint(d){
  document.getElementById("stamp").textContent="GEN: "+(d.as_of||"")+" JST";

  const mood=moodOf(d.macro||[]);
  const m=document.getElementById("mood");
  m.className="mood "+mood; m.textContent = mood==="dn" ? "RISK-OFF ▼" : "RISK-ON ▲";

  // ticker from tape
  document.getElementById("ticker").innerHTML=(d.tape||[]).map(r=>
    `<span class="tk"><span class="num">${r[0]}</span> <span class="${cls(r[2])}">${pc(r[2])}</span></span>`).join("");

  // macro table (count-up on value)
  document.querySelector("#macro tbody").innerHTML=(d.macro||[]).map(r=>{
    const val=parseFloat(String(r.v).replace(/,/g,""));
    return `<tr><td class="l">${r.k}</td><td class="num" data-cu="${val}" data-d="2"></td><td class="${cls(r.c)}">${pc(r.c)}</td></tr>`;
  }).join("");

  // holdings cards with sparkline
  document.getElementById("holds").innerHTML=(d.holds||[]).map(h=>{
    const up=h.chg>=0;
    return `<div class="hold">
      <div class="r1">
        <span><span class="nm">${h.nm}</span> <span class="code">${h.code}</span></span>
        <span class="px ${cls(h.chg)}" data-cu="${h.px}" data-d="1"></span>
      </div>
      <div class="r2">
        <span class="${cls(h.chg)}">${pc(h.chg)}</span>
        <span>RSI ${h.rsi!=null?h.rsi.toFixed(0):"—"} · 25MA乖離 ${h.ma25!=null?h.ma25.toFixed(1)+"%":"—"} · 出来高 ${h.vol||"—"}</span>
      </div>
      ${h.flag?`<div class="flag">⚠ ${h.flag}</div>`:""}
      ${spark(h.s,up)}
    </div>`;
  }).join("");

  // semi heatmap from tape
  document.getElementById("semi").innerHTML=(d.tape||[]).map(r=>{
    const c=cls(r[2]);
    return `<div class="cell"><div class="cnm">${r[0]}</div><div class="pc ${c}">${pc(r[2])}</div><div class="cl">${fmt(r[1])}</div></div>`;
  }).join("");

  // news feed
  document.getElementById("feed").innerHTML=(d.feed||[]).map(n=>{
    const tag = n.tag==="td" ? `<span class="td">[開示]</span> ` : "";
    return `<li><span class="tm">${n.tm||""}</span>${tag}${n.html}</li>`;
  }).join("");

  // count-up + flash
  document.querySelectorAll("[data-cu]").forEach((el,i)=>{
    const tgt=parseFloat(el.dataset.cu), dc=parseInt(el.dataset.d);
    if(isNaN(tgt)){el.textContent="—";return;}
    setTimeout(()=>{ el.classList.add("flash"); countUp(el,tgt,dc); }, 120+i*35);
  });
}

const BOOT=[
  ["> MORNING//STRATEGIST  [PID 0x1A2F]",""],
  ["> mounting /out/dashboard.json ...","ok"],
  ["> auth yfinance ....... session live","ok"],
  ["> auth J-Quants ....... credentials","warn"],
  ["> pulling macro feed ................","ok"],
  ["> pulling holdings [3 tickers] ......","ok"],
  ["> pulling semi sector ...............","ok"],
  ["> RSS news layer [A/B/C] ............","ok"],
  ["> fact-check: 数値のみ (LLM未使用) ..","ok"],
  ["> render terminal ui ................","ok"],
];
function boot(cb){
  const box=document.getElementById("boot"); let i=0;
  (function next(){
    if(i>=BOOT.length){ setTimeout(()=>{ box.classList.add("done"); cb(); },350); return; }
    const [txt,st]=BOOT[i];
    const ln=document.createElement("div"); ln.className="ln";
    const tag = st==="ok"?` <span class="ok">[OK]</span>` : st==="warn"?` <span class="warn">[SKIP]</span>` : "";
    ln.innerHTML=txt+tag; box.appendChild(ln); i++;
    setTimeout(next, 90+Math.random()*110);
  })();
}
function go(d){ boot(()=>{ document.getElementById("wrap").classList.add("in"); paint(d); }); }

fetch("out/dashboard.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(go)
  .catch(()=>{
    document.getElementById("boot").innerHTML=
      '<div class="ln">> out/dashboard.json が読み込めません <span class="warn">[NO DATA]</span></div>'+
      '<div class="ln" style="color:#3f7a58">> main.py を実行して out/dashboard.json を生成してください</div>';
  });
</script>
</body>
</html>
