<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORNING STRATEGIST — DASHBOARD</title>
<style>
  :root{
    --bg:#0c0f14; --panel:#12161d; --panel2:#0f1319; --line:#232a35; --line-soft:#1a2029;
    --txt:#d7dde5; --mut:#7a8494; --mut-dim:#4d5563;
    --accent:#c9a15a; --accent-dim:#8a744a;
    --up:#3fbf80; --up-dim:#255c3d; --dn:#e2596b; --dn-dim:#6b2530; --flat:#7a8494;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.5}
  body{padding:14px 16px 24px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{max-width:1400px;margin:0 auto}

  a{color:inherit}
  .na{color:var(--mut-dim);font-style:normal}
  .empty{color:var(--mut-dim);padding:10px 2px;font-size:12px}

  /* ---- top bar ---- */
  .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
       border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
  .brand{font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--accent)}
  .brand small{color:var(--mut);font-weight:400;font-size:11px;margin-left:8px;letter-spacing:.02em}
  .top-right{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--mut)}
  .mood{padding:3px 10px;border-radius:2px;font-weight:600;font-size:11px;border:1px solid}
  .mood.up{color:var(--up);border-color:var(--up-dim);background:rgba(63,191,128,.08)}
  .mood.dn{color:var(--dn);border-color:var(--dn-dim);background:rgba(226,89,107,.08)}
  .mood.na{color:var(--mut);border-color:var(--line)}

  /* ---- quote strip ---- */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:1px;
         background:var(--line);border:1px solid var(--line);margin-bottom:12px}
  .qc{background:var(--panel);padding:8px 10px}
  .qc .lb{color:var(--mut);font-size:10.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qc .vl{font-size:15px;font-weight:600;margin-top:2px}
  .qc .ch{font-size:11px;margin-top:1px}
  .up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--flat)}

  /* ---- layout ---- */
  .cols{display:grid;grid-template-columns:260px 1fr 300px;gap:12px}
  @media(max-width:1080px){.cols{grid-template-columns:1fr 1fr}}
  @media(max-width:680px){.cols{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .panel h2{margin:0;font-size:10.5px;letter-spacing:.1em;color:var(--mut);background:var(--panel2);
            border-bottom:1px solid var(--line);padding:7px 10px;text-transform:uppercase;
            display:flex;justify-content:space-between;align-items:center}
  .panel h2 .note{font-size:9.5px;color:var(--mut-dim);text-transform:none;letter-spacing:0}
  .panel .body{padding:8px 10px;overflow:auto}
  .full{grid-column:1/-1}

  /* ---- watchlist ---- */
  .wl-item{padding:7px 6px;border:1px solid transparent;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .wl-item:last-child{border-bottom:none}
  .wl-item:hover{background:rgba(255,255,255,.03)}
  .wl-item.sel{border-color:var(--accent-dim);background:rgba(201,161,90,.07)}
  .wl-item .r1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .wl-item .nm{font-weight:600;font-size:12.5px}
  .wl-item .code{color:var(--mut);font-size:10px;margin-left:4px}
  .wl-item .px{font-weight:600;font-size:13px}
  .wl-item .r2{display:flex;justify-content:space-between;color:var(--mut);font-size:10.5px;margin-top:2px}
  .wl-item .fresh{font-size:9.5px;color:var(--mut-dim)}
  .wl-item .flag{color:var(--accent);font-size:10px;margin-top:3px}

  /* ---- center chart ---- */
  .chart-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chart-title{font-size:13px;font-weight:600}
  .chart-sub{color:var(--mut);font-size:10.5px}
  .periods{display:flex;gap:4px}
  .periods button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);
                  font-size:10.5px;padding:3px 8px;cursor:pointer;font-family:var(--sans)}
  .periods button.on{color:var(--accent);border-color:var(--accent-dim)}
  .periods button:disabled{opacity:.35;cursor:not-allowed}
  .chart-box{position:relative}
  .chart-box svg{display:block;width:100%;height:220px}
  .chart-tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);
             padding:4px 8px;font-size:10.5px;color:var(--txt);white-space:nowrap;display:none}
  .stat-row{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
  .stat-row b{color:var(--txt);font-weight:600}

  /* ---- ai panel ---- */
  .ai-lines{margin:0 0 8px;padding-left:16px}
  .ai-lines li{margin-bottom:4px;font-size:12px}
  .ai-point{border-top:1px dashed var(--line);padding-top:8px;font-size:12px;color:var(--accent)}

  /* ---- heatmap ---- */
  .heat{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .hcell{border:1px solid var(--line);padding:8px;background:var(--panel2)}
  .hcell .nm{font-size:11px;color:var(--mut)}
  .hcell .pc{font-size:14px;font-weight:600;margin-top:3px}
  .hcell.na{opacity:.55}
  .hcell .def{font-size:9px;color:var(--mut-dim);margin-top:8px;line-height:1.4}

  /* ---- news ---- */
  .news-filters{display:flex;gap:6px;font-size:10px}
  .news-filters button{background:none;border:1px solid var(--line);color:var(--mut);padding:2px 7px;cursor:pointer;font-family:var(--sans)}
  .news-filters button.on{color:var(--txt);border-color:var(--mut)}
  .news{margin:0;padding:0;list-style:none}
  .news li{border-bottom:1px solid var(--line-soft);padding:7px 2px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
  .news li:last-child{border-bottom:none}
  .news .tm{color:var(--mut-dim);font-size:10.5px;white-space:nowrap;padding-top:1px}
  .badge{font-size:9px;padding:1px 5px;border-radius:2px;white-space:nowrap;font-weight:600}
  .badge.imp4{background:rgba(226,89,107,.18);color:var(--dn)}
  .badge.imp3{background:rgba(201,161,90,.18);color:var(--accent)}
  .badge.imp2{background:rgba(122,132,148,.18);color:var(--mut)}
  .badge.imp1{background:transparent;color:var(--mut-dim);border:1px solid var(--line)}
  .news .txt b{color:var(--txt)}
  .news .txt a{text-decoration:none}
  .news .txt a:hover{text-decoration:underline}
  .news .src{color:var(--mut-dim);font-size:10px;margin-left:4px}

  .foot{color:var(--mut-dim);font-size:10px;text-align:center;margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
  #boot-msg{padding:30px 10px;color:var(--mut);font-size:12px}
  #boot-msg .warn{color:var(--dn)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top">
    <div class="brand">MORNING STRATEGIST<small>保有株モーニングダッシュボード</small></div>
    <div class="top-right">
      <span id="stamp">—</span>
      <span class="mood na" id="mood">—</span>
    </div>
  </div>

  <div id="boot-msg" style="display:none"></div>

  <div id="main" style="display:none">
    <div class="strip" id="strip"></div>

    <div class="cols">
      <div class="panel" id="panel-watchlist">
        <h2>保有ウォッチリスト</h2>
        <div class="body" id="watchlist"></div>
      </div>

      <div class="panel" id="panel-chart">
        <h2>価格チャート</h2>
        <div class="body">
          <div class="chart-head">
            <div>
              <div class="chart-title" id="chart-title">—</div>
              <div class="chart-sub" id="chart-sub"></div>
            </div>
            <div class="periods" id="periods"></div>
          </div>
          <div class="chart-box" id="chart-box"></div>
          <div class="stat-row" id="chart-stats"></div>
        </div>
      </div>

      <div class="panel" id="panel-ai">
        <h2>AIサマリー<span class="note">未接続時は算出不可</span></h2>
        <div class="body" id="ai-body"></div>
      </div>

      <div class="panel full" id="panel-sector">
        <h2>セクターヒートマップ<span class="note">前日比・構成銘柄の単純平均</span></h2>
        <div class="body"><div class="heat" id="heat"></div></div>
      </div>

      <div class="panel full" id="panel-news">
        <h2>ブレーキングニュース
          <span class="news-filters" id="news-filters"></span>
        </h2>
        <div class="body"><ul class="news" id="feed"></ul></div>
      </div>
    </div>
  </div>

  <div class="foot">DATA: yfinance / J-Quants / TDnet / Google News RSS &nbsp;·&nbsp; 全数値はPython計算結果・投資助言ではない &nbsp;·&nbsp; 欠損値は必ず明示表示（推定・補完はしない）</div>
</div>

<script>
/* =========================================================================
   CONFIG
   allowSim は絶対に true にしない。ダミー/シミュレーションデータを生成する
   コードはこのファイルに一切存在しない。データが無い場合は必ず明示欠損表示にする。
   ========================================================================= */
const CONFIG = {
  allowSim: false,

  // 指標ストリップの固定枠。label=表示名、as=dashboard.json側 macro[].k の別名候補。
  // 突き合わせは正規化(空白除去+全角/半角統一+大文字化)した完全一致のみで行う。
  // 部分一致は使わない（例: "GOLDMAN" が "GOLD" 枠に誤って吸われるのを防ぐため）。
  quoteSlots: [
    { label: "日経平均", as: ["日経225", "NIKKEI225", "N225"] },
    { label: "TOPIX",   as: ["TOPIX"] },
    { label: "USD/JPY", as: ["ドル円", "USDJPY", "USD-JPY"] },
    { label: "米10年債", as: ["米10年債利回り", "US10Y", "米10年金利"] },
    { label: "VIX",     as: ["VIX恐怖指数"] },
    { label: "SOX",     as: ["SOX半導体指数"] },
    { label: "S&P500",  as: ["S&P 500", "SP500"] },
    { label: "NASDAQ",  as: [] },
    { label: "WTI",     as: ["WTI原油"] },
    { label: "GOLD",    as: ["金(GOLD)", "金"] },
  ],

  // セクターヒートマップの表示枠。データソースが無いセクターは「データなし」のまま残す。
  // (半導体だけ src/dashboard.py が実データを出力できる。他は取得手段が未実装。)
  sectors: ["AI", "半導体", "銀行", "商社", "自動車", "防衛", "エネルギー", "不動産"],

  // 中央チャートの期間ボタン。nは営業日数（カレンダー日数ではない）。
  // 実データがn本に満たない場合はボタンを無効化し、存在しない期間を捏造しない。
  chartPeriods: [
    { label: "5日", n: 5 },
    { label: "1ヶ月", n: 21 },
    { label: "3ヶ月", n: 63 },
    { label: "6ヶ月", n: 126 },
    { label: "1年", n: 252 },
  ],

  quotesPollMs: 15000,   // out/quotes.json の再取得間隔
  freshWarnSec: 600,     // これより古い場中値は「更新停止」扱いで警告表示
};

/* ========================================================================= */

function normLabel(s){
  return String(s==null?"":s).normalize("NFKC").replace(/[\s　]+/g,"").toUpperCase();
}
function fmt2(n){ return Number(n).toLocaleString("ja-JP",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function cls(v){ return v>0?"up":v<0?"dn":"flat"; }
function arw(v){ return v>0?"▲":v<0?"▼":"■"; }
function pc(v){ return (v==null||isNaN(v)) ? "—" : arw(v)+Math.abs(v).toFixed(2)+"%"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---- macro strip: 固定枠に正規化完全一致でマージ。余った指標は独立セルとして追加 ---- */
function adaptMacro(macro){
  macro = macro || [];
  const used = new Set();
  const slots = CONFIG.quoteSlots.map(slot=>{
    const cands = new Set([slot.label, ...(slot.as||[])].map(normLabel));
    const idx = macro.findIndex((m,i)=>!used.has(i) && cands.has(normLabel(m.k)));
    if(idx>=0){ used.add(idx); const m=macro[idx]; return {label:slot.label, v:m.v, c:m.c, has:true}; }
    return {label:slot.label, v:null, c:null, has:false};
  });
  const extra = macro.filter((m,i)=>!used.has(i)).map(m=>({label:m.k, v:m.v, c:m.c, has:true}));
  return slots.concat(extra);
}

function renderStrip(macro){
  const cells = adaptMacro(macro);
  document.getElementById("strip").innerHTML = cells.map(c=>{
    if(!c.has){
      return `<div class="qc"><div class="lb">${esc(c.label)}</div><div class="vl na">—</div><div class="ch na">データなし</div></div>`;
    }
    return `<div class="qc"><div class="lb">${esc(c.label)}</div>
      <div class="vl num">${esc(c.v)}</div>
      <div class="ch num ${cls(c.c)}">${pc(c.c)}</div></div>`;
  }).join("");
}

/* ---- mood: 日経とSOXの前日比平均。両方欠損なら判定不能 ---- */
function moodOf(macro){
  const n225 = (macro||[]).find(m=>normLabel(m.k)===normLabel("日経225"));
  const sox  = (macro||[]).find(m=>normLabel(m.k)===normLabel("SOX半導体指数"));
  const vals = [n225,sox].filter(Boolean).map(m=>m.c).filter(v=>v!=null && !isNaN(v));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

/* ---- 場中値（quotes.json）。無ければ null。あってもコードが無ければ null ---- */
let QUOTES = null; // {generated_at_jst, quotes:{code:{price, ts_jst}}}

async function pollQuotes(){
  try{
    const r = await fetch("out/quotes.json?_="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("no quotes.json");
    QUOTES = await r.json();
  }catch(e){
    QUOTES = null; // ファイル自体が無い/失敗 → 場中更新なし。静的スナップショットのみ表示
  }
  if(STATE.data) renderWatchlist(STATE.data.holds);
}

function liveFor(code){
  if(!QUOTES || !QUOTES.quotes || !QUOTES.quotes[code]) return null;
  const q = QUOTES.quotes[code];
  if(q.price==null || !q.ts_jst) return null;
  const ageSec = (Date.now() - Date.parse(q.ts_jst)) / 1000;
  return { price: q.price, ageSec };
}

/* ---- watchlist ---- */
const STATE = { data:null, selectedCode:null, period:CONFIG.chartPeriods[CONFIG.chartPeriods.length-1] };

function renderWatchlist(holds){
  holds = holds || [];
  if(!STATE.selectedCode && holds.length) STATE.selectedCode = holds[0].code;
  document.getElementById("watchlist").innerHTML = holds.map(h=>{
    const live = liveFor(h.code);
    let px = h.px, chg = h.chg, freshHtml = '<span class="fresh">寄付き時点のスナップショット</span>';
    if(live){
      const prevClose = (h.chg!=null && h.chg !== -100) ? h.base/(1+h.chg/100) : null;
      px = live.price;
      chg = prevClose ? (live.price/prevClose - 1)*100 : h.chg;
      const ageTxt = live.ageSec < 60 ? Math.round(live.ageSec)+"秒前"
                     : Math.round(live.ageSec/60)+"分前";
      const stale = live.ageSec > CONFIG.freshWarnSec;
      freshHtml = `<span class="fresh" style="${stale?'color:var(--dn)':''}">${stale?'更新停止 ':''}${ageTxt}</span>`;
    } else if (QUOTES && QUOTES.quotes && !(h.code in QUOTES.quotes)) {
      freshHtml = '<span class="fresh" style="color:var(--dn)">場中更新: 取得できていません</span>';
    }
    const sel = h.code===STATE.selectedCode ? " sel" : "";
    return `<div class="wl-item${sel}" data-code="${esc(h.code)}">
      <div class="r1"><span><span class="nm">${esc(h.nm)}</span><span class="code">${esc(h.code)}</span></span>
      <span class="px num ${cls(chg)}">${px!=null?fmt2(px):"—"}</span></div>
      <div class="r2"><span class="${cls(chg)}">${pc(chg)}</span>${freshHtml}</div>
      ${h.flag?`<div class="flag">⚠ ${esc(h.flag)}</div>`:""}
    </div>`;
  }).join("") || '<div class="empty">保有銘柄データがありません</div>';

  document.querySelectorAll(".wl-item").forEach(el=>{
    el.addEventListener("click", ()=>{ STATE.selectedCode = el.dataset.code; renderAll(); });
  });
}

/* ---- center chart ---- */
function renderPeriods(hist){
  const n = hist && hist.c ? hist.c.length : 0;
  document.getElementById("periods").innerHTML = CONFIG.chartPeriods.map(p=>{
    const disabled = n < 2;
    const on = p===STATE.period;
    return `<button data-n="${p.n}" ${disabled?"disabled":""} class="${on?"on":""}">${esc(p.label)}</button>`;
  }).join("");
  document.querySelectorAll("#periods button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      STATE.period = CONFIG.chartPeriods.find(p=>String(p.n)===btn.dataset.n);
      renderChart();
    });
  });
}

function renderChart(){
  const holds = STATE.data.holds || [];
  const h = holds.find(x=>x.code===STATE.selectedCode);
  const box = document.getElementById("chart-box");
  const statRow = document.getElementById("chart-stats");
  if(!h){
    document.getElementById("chart-title").textContent = "—";
    document.getElementById("chart-sub").textContent = "";
    box.innerHTML = '<div class="empty">銘柄が選択されていません</div>';
    statRow.innerHTML = "";
    document.getElementById("periods").innerHTML = "";
    return;
  }
  document.getElementById("chart-title").textContent = h.nm + " (" + h.code + ")";

  const hist = h.hist;
  if(!hist || !hist.c || hist.c.length < 2){
    // 価格履歴が無い場合は軸も期間ボタンも一切出さない（存在しないものを匂わせない）
    document.getElementById("periods").innerHTML = "";
    document.getElementById("chart-sub").textContent = "";
    box.innerHTML = '<div class="empty">価格履歴を取得できていません</div>';
    statRow.innerHTML = "";
    return;
  }
  renderPeriods(hist);

  const wantN = STATE.period.n;
  const n = Math.min(wantN, hist.c.length);
  const clipped = n < wantN;
  const closes = hist.c.slice(-n);
  const dates = hist.d.slice(-n);
  document.getElementById("chart-sub").textContent =
    `${dates[0]} 〜 ${dates[dates.length-1]}（${n}営業日）` + (clipped ? "　※要求期間分のデータがないため全期間を表示" : "");

  const W=560,Hh=220,padL=44,padR=10,padT=10,padB=20;
  const mn=Math.min(...closes), mx=Math.max(...closes), rng=(mx-mn)||1;
  const x=i=> padL + (W-padL-padR) * i/(closes.length-1);
  const y=v=> padT + (Hh-padT-padB) * (1-(v-mn)/rng);
  const pts = closes.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const up = closes[closes.length-1] >= closes[0];
  const col = up ? "#3fbf80" : "#e2596b";

  const yTicks=4, gridLines=[];
  for(let i=0;i<=yTicks;i++){
    const v = mn + rng*i/yTicks;
    const yy = y(v);
    gridLines.push(`<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#1a2029" stroke-width="1"/>`);
    gridLines.push(`<text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="#7a8494" font-family="var(--mono)">${fmt2(v)}</text>`);
  }

  box.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">
      ${gridLines.join("")}
      <polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts}"/>
    </svg><div class="chart-tip" id="chart-tip"></div>`;

  const svg = box.querySelector("svg");
  const tip = document.getElementById("chart-tip");
  svg.addEventListener("mousemove", ev=>{
    const rect = svg.getBoundingClientRect();
    const relX = (ev.clientX-rect.left)/rect.width * W;
    const i = Math.max(0, Math.min(closes.length-1, Math.round((relX-padL)/(W-padL-padR)*(closes.length-1))));
    tip.style.display="block";
    tip.style.left = Math.min(rect.width-120, Math.max(0,(ev.clientX-rect.left+8)))+"px";
    tip.style.top = (ev.clientY-rect.top-28)+"px";
    tip.innerHTML = `${dates[i]}<br><b class="num">${fmt2(closes[i])}</b>`;
  });
  svg.addEventListener("mouseleave", ()=>{ tip.style.display="none"; });

  const periodChg = ((closes[closes.length-1]/closes[0])-1)*100;
  statRow.innerHTML = `
    <span>期間高値 <b class="num">${fmt2(mx)}</b></span>
    <span>期間安値 <b class="num">${fmt2(mn)}</b></span>
    <span>期間騰落 <b class="num ${cls(periodChg)}">${pc(periodChg)}</b></span>
    <span>RSI <b class="num">${h.rsi!=null?h.rsi.toFixed(1):"—"}</b></span>
    <span>25MA乖離 <b class="num">${h.ma25!=null?h.ma25.toFixed(1)+"%":"—"}</b></span>
    <span>出来高 <b class="num">${esc(h.vol||"—")}</b></span>`;
}

/* ---- AI summary ---- */
function renderAI(ai){
  const el = document.getElementById("ai-body");
  if(!ai || !Array.isArray(ai.lines) || !ai.lines.length){
    el.innerHTML = '<div class="empty">算出不可（AI要約層は未接続）</div>';
    return;
  }
  el.innerHTML = `<ul class="ai-lines">${ai.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>` +
    (ai.point ? `<div class="ai-point">▶ ${esc(ai.point)}</div>` : "");
}

/* ---- sector heatmap ---- */
function renderHeat(sectors){
  sectors = sectors || {};
  document.getElementById("heat").innerHTML = CONFIG.sectors.map(name=>{
    const v = sectors[name];
    if(v==null){
      return `<div class="hcell na"><div class="nm">${esc(name)}</div><div class="pc na">データなし</div></div>`;
    }
    return `<div class="hcell"><div class="nm">${esc(name)}</div><div class="pc num ${cls(v)}">${pc(v)}</div></div>`;
  }).join("") + `<div class="def full" style="grid-column:1/-1">定義: セクター値=構成銘柄の前日比(%)の単純平均（加重ではない）。データソースが無いセクターは「データなし」のまま表示し、値を推定しない。</div>`;
}

/* ---- breaking news ---- */
function feedImportance(n){
  if(n.tag==="td" && n.hot) return 4;
  if(n.tag==="td") return 3;
  if(n.tag==="mk" && (n.matched||[]).length>=2) return 2;
  return 1;
}
const IMP_LABEL = {4:"最重要",3:"重要",2:"注目",1:"通常"};
let newsFilter = 0; // 0 = 全て

function renderNewsFilters(){
  const opts = [0,4,3,2,1];
  document.getElementById("news-filters").innerHTML = opts.map(v=>{
    const label = v===0 ? "全て" : IMP_LABEL[v];
    return `<button data-v="${v}" class="${newsFilter===v?"on":""}">${label}</button>`;
  }).join("");
  document.querySelectorAll("#news-filters button").forEach(b=>{
    b.addEventListener("click", ()=>{ newsFilter = Number(b.dataset.v); renderNews(STATE.data); });
  });
}

function renderNews(d){
  const feed = d.feed || [];
  const listEl = document.getElementById("feed");
  if(!feed.length){
    const tdS = d.tdnet_status, nwS = d.news_status;
    const failed = /取得失敗/.test(tdS||"") || /取得失敗/.test(nwS||"");
    listEl.innerHTML = `<div class="empty">${failed ? "ニュース取得に失敗しました（取得失敗。0件は正常な「該当なし」とは別の状態です）" : "該当するニュース・開示はありません（正常な0件）"}</div>`;
    return;
  }
  const rows = feed.filter(n=>newsFilter===0 || feedImportance(n)===newsFilter);
  if(!rows.length){
    listEl.innerHTML = '<div class="empty">この重要度に該当する項目はありません</div>';
    return;
  }
  listEl.innerHTML = rows.map(n=>{
    const imp = feedImportance(n);
    const body = n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${n.html}</a>` : n.html;
    return `<li>
      <span class="tm num">${esc(n.tm||"")}</span>
      <span class="badge imp${imp}">${IMP_LABEL[imp]}</span>
      <span class="txt">${body}${n.source?`<span class="src">[${esc(n.source)}]</span>`:""}</span>
    </li>`;
  }).join("");
}

/* ---- top-level paint ---- */
function renderAll(){
  const d = STATE.data;
  renderStrip(d.macro);
  const mood = moodOf(d.macro);
  const moodEl = document.getElementById("mood");
  if(mood==null){ moodEl.className="mood na"; moodEl.textContent="判定不能"; }
  else { moodEl.className = "mood "+(mood<0?"dn":"up"); moodEl.textContent = mood<0?"リスクオフ ▼":"リスクオン ▲"; }
  renderWatchlist(d.holds);
  renderChart();
  renderAI(d.ai);
  renderHeat(d.sectors);
  renderNewsFilters();
  renderNews(d);
}

function boot(d){
  document.getElementById("stamp").textContent = "生成: " + (d.as_of || "—") + " JST";
  STATE.data = d;
  document.getElementById("boot-msg").style.display="none";
  document.getElementById("main").style.display="block";
  renderAll();
  pollQuotes();
  setInterval(pollQuotes, CONFIG.quotesPollMs);
}

fetch("out/dashboard.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)))
  .then(boot)
  .catch(err=>{
    document.getElementById("boot-msg").style.display="block";
    document.getElementById("boot-msg").innerHTML =
      `<div>out/dashboard.json を読み込めません <span class="warn">[NO DATA]</span></div>
       <div style="color:var(--mut-dim);margin-top:6px">main.py (src/main.py) を実行して out/dashboard.json を生成してください。（${esc(err.message)}）</div>`;
  });
</script>
</body>
</html>
