      - {code: "5803.T", name: "フジクラ"}
      - {code: "5801.T", name: "古河電工"}
      - {code: "5802.T", name: "住友電工"}

# ===== 投資信託（NISA） =====
# 株式とは性質が異なるため holdings には入れない。日次基準価額のみを扱い、
# RSI / MA25乖離 などのテクニカルは一切算出しない。
# 取得元は Yahoo!ファイナンス投信ページの __PRELOADED_STATE__（協会コード指定）。
# 2026-08-26 に実際に取得成功を確認:
#   03311187 eMAXIS Slim米国株式(S&P500) = 44,836円 (-7 / -0.02%) updateDate 08/25
#     → 運用会社の公式CSV https://www.am.mufg.jp/fund_file/setteirai/253266.csv の
#       2026/08/25 行 44836 と一致することを突き合わせ済み
#   04311181 iFreeNEXT FANG+インデックス   = 97,668円 (-493 / -0.50%) updateDate 08/25
funds:
  - {code: "03311187", name: "eMAXIS Slim 米国株式(S&P500)"}
  - {code: "04311181", name: "iFreeNEXT FANG+インデックス"}

