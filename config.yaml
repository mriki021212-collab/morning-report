# 履歴が短くアナログ分析が成立しない銘柄 → 同業ピアで代替する
# キオクシアは2024/12上場、履歴約1.6年のため単体では統計不成立
peer_proxy:
  "285A.T":
    reason: "2024年12月上場のため履歴約1.6年。単体でのアナログ分析は統計的に不成立。"
    peers: ["MU", "SNDK", "000660.KS"]

# ===== アナログ（過去チャート類似）検索 =====
analog:
  window: 60          # 直近何営業日のパターンを検索キーにするか
  horizon: 20         # その後何営業日のリターンを集計するか
  top_k: 20           # 上位いくつの類似局面を採用するか
  min_history: "2005-01-01"

# ===== ニュースRSS =====
