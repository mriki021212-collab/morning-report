# ===== 監視対象 =====
# holdings = 実際に保有している銘柄。保有パネルとポートフォリオ統計の母集団はここだけ。
# watch    = 非保有だが継続監視する銘柄。ニュース/TDnet/決算/アナログ分析の対象には含めるが、
#            保有パネルとポートフォリオ統計からは除外する。
#            6740 は 2026-08 に全株売却。過去に債務超過リスク等の分析を積み上げた銘柄のため
#            定義ごと削除せずここへ移し、時系列の連続性を保つ。
holdings:
  - {code: "7974.T", name: "任天堂"}
  - {code: "5803.T", name: "フジクラ"}

watch:
  - {code: "6740.T", name: "ジャパンディスプレイ"}
  - {code: "285A.T", name: "キオクシアHD"}

# 日本半導体セクター。この9銘柄の構成は変更しないこと。
# 構成を動かすと sectors["半導体"] の過去値と比較できなくなる。
sector:
  - {code: "8035.T", name: "東京エレクトロン"}
  - {code: "6920.T", name: "レーザーテック"}
  - {code: "6146.T", name: "ディスコ"}
  - {code: "6857.T", name: "アドバンテスト"}
  - {code: "7735.T", name: "SCREEN"}
  - {code: "6723.T", name: "ルネサス"}
  - {code: "6526.T", name: "ソシオネクスト"}
  - {code: "4063.T", name: "信越化学"}
  - {code: "3436.T", name: "SUMCO"}

# 半導体以外の追加セクター。sector: とは別枠にすることで半導体の定義を汚さない。
# 算出方法は半導体と同一: 構成銘柄の前日比(%)の単純平均（加重ではない）。
# 3銘柄とも yfinance で日足取得できることを実測確認済み（2026-08-26 / last=2026-08-26 /
# 5803=5256.00, 5801=3882.00, 5802=2218.00）。取得できない銘柄は無い。
sector_groups:
  "電線・データセンター関連":
    members:
      - {code: "5803.T", name: "フジクラ"}
      - {code: "5801.T", name: "古河電工"}
      - {code: "5802.T", name: "住友電工"}

# ===== 投資信託（NISA） =====
# 株式とは性質が異なるため holdings には入れない。日次基準価額のみを扱い、
# RSI / MA25乖離 などのテクニカルは一切算出しない。
# 取得元は Yahoo!ファイナンス投信ページの __PRELOADED_STATE__（協会コード指定）。
# 2026-08-26 に実際に取得成功を確認:
#   03311187 eMAXIS Slim米国株式(S&P500) = 44,836円 (-7 / -0.02%) updateDate 08/25
#     → 運用会社の公式CSV https://www.am.mufg.jp/fund_file/setteirai/253266.csv の
#       2026/08/25 行 44836 と一致することを突き合わせ済み
#   04311181 iFreeNEXT FANG+インデックス   = 97,668円 (-493 / -0.50%) updateDate 08/25
funds:
  - {code: "03311187", name: "eMAXIS Slim 米国株式(S&P500)"}
  - {code: "04311181", name: "iFreeNEXT FANG+インデックス"}

# ===== 米国市場・マクロ =====
macro:
  - {code: "^IXIC",  name: "NASDAQ"}
  - {code: "^GSPC",  name: "S&P500"}
  - {code: "^DJI",   name: "ダウ"}
  - {code: "^SOX",   name: "SOX指数"}
  - {code: "^VIX",   name: "VIX"}
  - {code: "JPY=X",  name: "ドル円"}
  - {code: "^TNX",   name: "米10年金利"}
  - {code: "CL=F",   name: "WTI"}
  - {code: "GC=F",   name: "金"}
  - {code: "^N225",  name: "日経平均"}
  - {code: "NIY=F",  name: "日経平均先物(CME円建)"}

overseas_semis:
  - {code: "NVDA", name: "NVIDIA"}
  - {code: "SNDK", name: "SanDisk (NAND)"}
  - {code: "000660.KS", name: "SK hynix"}
  - {code: "005930.KS", name: "Samsung Electronics"}
  - {code: "AMD",  name: "AMD"}
  - {code: "INTC", name: "Intel"}
  - {code: "MU",   name: "Micron"}
  - {code: "TSM",  name: "TSMC"}
  - {code: "ASML", name: "ASML"}

# 履歴が短くアナログ分析が成立しない銘柄 → 同業ピアで代替する
# キオクシアは2024/12上場、履歴約1.6年のため単体では統計不成立
peer_proxy:
  "285A.T":
    reason: "2024年12月上場のため履歴約1.6年。単体でのアナログ分析は統計的に不成立。"
    peers: ["MU", "SNDK", "000660.KS"]

# ===== 決算カレンダー =====
# 対象銘柄をここで定義する（earnings.py にハードコードしない）。
# yfinance の isEarningsDateEstimate が「企業が正式発表した日か」の判定に使える（実測確認済み）。
# manual: IRページで確認した日付を手で書く欄。yfinanceで取れない銘柄の受け皿。
#   yfinance より manual を優先する（人が一次情報で確認した日付のほうが強い）。
#   date を書いたら period も併記すること。書かなければ画面には「—」と出る。
earnings:
  targets:
    - {code: "6740.T", name: "ジャパンディスプレイ", region: "JP"}
    - {code: "7974.T", name: "任天堂",             region: "JP"}
    - {code: "5803.T", name: "フジクラ",           region: "JP"}
    - {code: "285A.T", name: "キオクシアHD",        region: "JP"}
    - {code: "8035.T", name: "東京エレクトロン",     region: "JP"}
    - {code: "6920.T", name: "レーザーテック",       region: "JP"}
    - {code: "6146.T", name: "ディスコ",           region: "JP"}
    - {code: "6857.T", name: "アドバンテスト",       region: "JP"}
    - {code: "7735.T", name: "SCREEN",           region: "JP"}
    - {code: "6723.T", name: "ルネサス",           region: "JP"}
    - {code: "6526.T", name: "ソシオネクスト",       region: "JP"}
    - {code: "4063.T", name: "信越化学",           region: "JP"}
    - {code: "3436.T", name: "SUMCO",            region: "JP"}
    - {code: "NVDA",   name: "NVIDIA",           region: "US"}
    - {code: "TSM",    name: "TSMC",             region: "US"}
    - {code: "ASML",   name: "ASML",             region: "US"}
    - {code: "AMD",    name: "AMD",              region: "US"}
    - {code: "MU",     name: "Micron",           region: "US"}
    - {code: "INTC",   name: "Intel",            region: "US"}
    - {code: "AMAT",   name: "Applied Materials", region: "US"}
    - {code: "LRCX",   name: "Lam Research",     region: "US"}
    - {code: "KLAC",   name: "KLA",              region: "US"}

  # 当日決算をHIGHアラートにする国内主力（セクター全体の地合いを決める銘柄）
  sector_bellwethers: ["8035.T", "6857.T", "6920.T"]

  # 手動メンテナンス欄。IRページで確認した日付だけを書く。推定日は書かない。
  # 例:
  #   "6740.T":
  #     date: "2026-08-07"
  #     period: "2027/3期 1Q"
  #     source_url: "https://www.j-display.com/ir/"
  manual: {}

# ===== アナログ（過去チャート類似）検索 =====
analog:
  window: 60          # 直近何営業日のパターンを検索キーにするか
  horizon: 20         # その後何営業日のリターンを集計するか
  top_k: 20           # 上位いくつの類似局面を採用するか
  min_history: "2005-01-01"

# ===== ニュースRSS =====
rss:
  # C層(全体地合い)専用。到達性を本人PCで実測し200を返したものだけ。
  # 個別銘柄ニュース(B層)はGoogleニュース検索RSSをnews.py内で使うため、ここには不要。
  - https://assets.wor.jp/rss/rdf/nikkei/economy.rdf
  - https://assets.wor.jp/rss/rdf/nikkei/news.rdf
  - https://assets.wor.jp/rss/rdf/nikkei/business.rdf
  - https://assets.wor.jp/rss/rdf/sankei/economy.rdf
  - https://assets.wor.jp/rss/rdf/yomiuri/economy.rdf

# ===== モデル =====
model: "claude-opus-4-8"
max_tokens: 12000
