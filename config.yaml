       name: "日銀 金融政策決定会合 結果公表（1/21-22）",
       source_url: "https://www.boj.or.jp/mopo/mpmsche_minu/m_ref/mref260731a.pdf"}
    - {date: "2027-03-18", country: "JP", importance: "high",
