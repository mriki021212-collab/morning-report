name: morning-report

on:
  # GitHubのscheduleは高負荷時に「遅延」ではなく「実行されない」ことがある。
  # 実際に 2026-07-17 08:35 JST が不発だった。単発cronは落ちる前提で3本張る。
  # 重複投稿はキャッシュのマーカーで防ぐ。
  schedule:
    - cron: "30 23 * * 0-4"   # JST 08:30 (本命)
    - cron: "40 23 * * 0-4"   # JST 08:40 (保険1)
    - cron: "50 23 * * 0-4"   # JST 08:50 (保険2・寄り付き10分前が最終)
  workflow_dispatch:
  # push トリガーは外した。データ更新やコード修正をpushするたびに
  # レポートが生成されDiscordに投稿されてしまうため（実際に夜間に余分な通知が出た）。
  # 手動で流したいときは workflow_dispatch を使う。

# GitHubは60日間コミットが無いリポジトリのscheduleを自動停止する。
# 停止時はメール通知が来るので、何かpushするかActions画面で再有効化する。

# out/posted.json（投稿済みマーカー）を自分でコミットするため書き込み権限が要る
permissions:
  contents: write

concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Compute JST date
        id: d
        run: echo "today=$(TZ=Asia/Tokyo date +%Y%m%d)" >> $GITHUB_OUTPUT

      # 同じ日に既に投稿済みかをキャッシュで判定（3本のcronの重複投稿を防ぐ）
      # 手動実行とpushは常に走らせたいのでマーカーを見ない
      - name: Check today's marker
        id: marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .posted
          key: posted-${{ steps.d.outputs.today }}

      - name: Decide
        id: go
        run: |
          if [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "already posted today - skip"
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.go.outputs.run == 'true'

      - name: Generate & post
        if: steps.go.outputs.run == 'true'
        # ANTHROPIC_API_KEY が未設定なら空文字が渡り、LLM層は自動スキップされる（検証済）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JQ_REFRESH_TOKEN: ${{ secrets.JQ_REFRESH_TOKEN }}
        run: python src/main.py

      - name: Save today's marker
        if: success() && steps.go.outputs.run == 'true' && github.event_name == 'schedule'
        run: touch .posted
      - uses: actions/cache/save@v4
        if: success() && steps.go.outputs.run == 'true' && github.event_name == 'schedule'
        with:
          path: .posted
          key: posted-${{ steps.d.outputs.today }}

      # 投稿済みマーカーを共有する。
      # このキャッシュのマーカー(.posted)はActions内でしか見えないので、
      # デスクトップのタスクとは共有できない。実測で 2026-08-28 に
      # デスクトップ 08:30 と Actions 16:00 が同じ朝レポートを2回投稿していた。
      # out/posted.json はリポジトリに入るので両者が読める。
      - name: Commit post marker
        if: success() && steps.go.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/posted.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no marker change"
          else
            git commit -m "posted: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') (morning)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Pythonに依存しない失敗通知。
      # pip installで落ちても、YAML読み込みで落ちても、ここは必ず動く。
      # これが無かったため 2026-07-17 の不発を「無音」で見逃した。
      - name: Notify failure
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"morning-report FAILED / event=${{ github.event_name }} / $URL\"}" \
            "$HOOK" || true

      - name: Archive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: ignore
